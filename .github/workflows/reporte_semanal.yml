name: Reporte semanal por correo

# Cada lunes a las 6:03 hora de Nicaragua (UTC-6) envía por Gmail el reporte semanal:
# resumen en el cuerpo, PDF del reporte y Excel con abiertos, cerrados de 7 días y
# semanas de backlog. Los adjuntos no se guardan (el repositorio es público).
# Secretos (Settings > Secrets and variables > Actions > Secrets):
#   SUPABASE_DB_URL       cadena de conexión (la misma de "Mantenimiento de la base")
#   CORREO_REPORTE        cuenta de Gmail que envía
#   CORREO_CLAVE_APP      contraseña de aplicación de esa cuenta
#   CORREO_DESTINATARIOS  correos separados por comas
on:
  schedule:
    - cron: "3 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CORREO_REPORTE: ${{ secrets.CORREO_REPORTE }}
      CORREO_CLAVE_APP: ${{ secrets.CORREO_CLAVE_APP }}
      CORREO_DESTINATARIOS: ${{ secrets.CORREO_DESTINATARIOS }}
    steps:
      - name: Verificar secretos
        id: config
        run: |
          falta=""
          for s in SUPABASE_DB_URL CORREO_REPORTE CORREO_CLAVE_APP CORREO_DESTINATARIOS; do
            [ -z "${!s}" ] && falta="$falta $s"
          done
          if [ -n "$falta" ]; then
            echo "::warning::No se envía el reporte: faltan los secretos$falta en Settings > Secrets and variables > Actions"
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.listo == 'si'
        uses: actions/checkout@v4
      - if: steps.config.outputs.listo == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.config.outputs.listo == 'si'
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium para el PDF
        if: steps.config.outputs.listo == 'si'
        run: npx playwright install --with-deps chromium
      - name: Armar y enviar
        if: steps.config.outputs.listo == 'si'
        run: npm run -s reporte:correo
